[package]
name = "ltc-mtc"
version = "0.3.0"
edition = "2021"
description = "SMPTE LTC reader: LTC -> MIDI Time Code, MIDI CC/PC and OSC events on timecode, web UI (ALSA, Raspberry Pi)"
license = "MIT"

[dependencies]
alsa = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"

[profile.release]
opt-level = 3
codegen-units = 4
